# yaml-language-server: $schema=https://json-schema.org/draft-07/schema

title: Networking config schema

$defs:
  nodepattern:
    type: string
    pattern: ^N\d$
  wirepattern:
    type: string
    pattern: ^W\d$
  IP:
    type: number
    minimum: 0x0
    exclusiveMaximum: 0x100

properties:
  config:
    type: object
    properties:
      HOSTNAME:
        type: string
      LOGGING_LEVEL:
        enum:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
          - CRITICAL
      RECEIVE_SIZE:
        type: integer
      SOCKET_TIMEOUT:
        type: number
    required:
      - HOSTNAME
      - LOGGING_LEVEL
      - RECEIVE_SIZE
      - SOCKET_TIMEOUT
    additionalProperties: false
  nodes:
    type: object
    patternProperties:
      ^N\d$:
        type: object
        properties:
          MAC:
            $ref: "#/$defs/nodepattern"
          IP:
            $ref: "#/$defs/IP"
          wire:
            $ref: "#/$defs/wirepattern"
          firewall:
            type: boolean
        additionalProperties: false
        required:
          - MAC
          - IP
          - wire
    additionalProperties: false
  wires:
    type: object
    patternProperties:
      ^W\d$:
        type: object
        properties:
          port:
            type: number
          subnet:
            type: number
          subnetMask:
            type: number
        required:
          - port
          - subnet
          - subnetMask
        additionalProperties: false
    additionalProperties: false
  routers:
    type: object
    properties:
      routing_table:
        type: object
        patternProperties:
          ^0x\d\d$:
            type: string
            pattern: ^R\d$
      interfaces:
        type: object
        patternProperties:
          ^R\d$:
            type: object
            properties:
              MAC:
                type: string
                pattern: ^R\d$
              IP:
                $ref: "#/$defs/IP"
              wire:
                $ref: "#/$defs/wirepattern"
            required:
              - MAC
              - IP
              - wire
    additionalProperties: false
    required:
      - interfaces
      - routing_table

required:
  - config
  - nodes
  - wires
  - routers

additionalProperties: false
